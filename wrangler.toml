# Cloudflare Worker (static assets) config for the SPP storefront SPA.
# Serves the built Vite app from ./dist on the WILDCARD route below, so every
# <slug>.thekartify.com renders the storefront — the SPA reads the slug from the
# first subdomain label (site/src/lib/storeApi.js resolveSlug).
#
# Build env vars (VITE_BASE_URL, VITE_PORTAL_URL) are set in the Cloudflare
# dashboard (Workers > this project > Settings > Variables), inlined at build.
name = "authntic-store"
compatibility_date = "2025-09-16"

[assets]
directory = "./dist"
# SPA client-side routing: serve index.html (200) for any unmatched path.
not_found_handling = "single-page-application"

# Wildcard: <anything>.thekartify.com is served by this Worker. Requires the
# proxied `*.thekartify.com` DNS record (already in place).
routes = [
  { pattern = "*.thekartify.com/*", zone_name = "thekartify.com" },
]
